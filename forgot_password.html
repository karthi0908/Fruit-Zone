<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCFruits - Forgot Password</title>
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="bala.css">
    <style>
        .login-card {
            max-width: 440px;
            margin: auto;
            padding: 2.8rem 2.2rem;
            text-align: center;
            margin-top: 5vh;
            width: 100%;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.94), rgba(15, 23, 42, 0.98));
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: card-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes card-appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            margin-bottom: 1.8rem;
            font-weight: 700;
            font-size: clamp(1.6rem, 5vw, 2.1rem);
            background: linear-gradient(to right, #60a5fa, #c084fc, #f43f5e, #60a5fa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .input-group {
            margin-bottom: 1.4rem;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .input-group:focus-within label {
            color: #60a5fa;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
            background: rgba(15, 23, 42, 0.95);
        }

        #save-btn {
            width: 100%;
            justify-content: center;
            margin-top: 1.2rem;
            min-height: 48px;
            font-size: 1.05rem;
            font-weight: 600;
            background: linear-gradient(to right, #3b82f6 0%, #8b5cf6 50%, #3b82f6 100%);
            background-size: 200% auto;
            border: none;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
            transition: all 0.4s ease;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
        }

        #save-btn:hover {
            background-position: right center;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.4);
        }

        #save-btn:active {
            transform: translateY(1px);
        }

        #save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-link-container {
            margin-top: 1.5rem;
            text-align: center;
        }

        .back-link-container a {
            color: #94a3b8;
            text-decoration: underline;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link-container a:hover {
            color: #60a5fa;
        }

        @media (max-width: 480px) {
            body {
                padding: 0.75rem 0.5rem;
            }

            .login-card {
                padding: 2.2rem 1.4rem;
                margin-top: 3vh;
                border-radius: 20px;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="background-animation"></div>

    <div class="app-container glassmorphism login-card">
        <h2>🔑 Forgot Password</h2>

        <div id="forgot-alert" class="alert hidden"></div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="forgot-username" placeholder="Enter username" value="rcfruits">
        </div>

        <div class="input-group">
            <label>New Password</label>
            <div style="position: relative;">
                <input type="password" id="forgot-new-password" placeholder="Enter new password" style="padding-right: 2.5rem;">
                <span id="toggle-forgot-new" class="toggle-pwd"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.7;"
                    title="Toggle Password Visibility">👁️</span>
            </div>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <div style="position: relative;">
                <input type="password" id="forgot-confirm-password" placeholder="Confirm new password" style="padding-right: 2.5rem;">
                <span id="toggle-forgot-confirm" class="toggle-pwd"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.7;"
                    title="Toggle Password Visibility">👁️</span>
            </div>
        </div>

        <button id="save-btn" class="btn-primary" type="button">
            <span class="btn-text">Save</span>
        </button>

        <div class="back-link-container">
            <a href="login.html" id="back-to-login-link">← Back to Login</a>
        </div>
    </div>

    <script src="forgot_password.js"></script>
</body>

</html>
