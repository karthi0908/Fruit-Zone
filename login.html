<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Fruits Login</title>
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="bala.css">
    <style>
        .login-card {
            max-width: 400px;
            margin: auto;
            padding: 3rem 2.5rem;
            text-align: center;
            margin-top: 10vh;
            width: 100%;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.98));
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: card-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes card-appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            margin-bottom: 2.2rem;
            font-weight: 700;
            font-size: clamp(1.5rem, 5vw, 2rem);
            background: linear-gradient(to right, #60a5fa, #c084fc, #f43f5e, #60a5fa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: -0.5px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .input-group {
            margin-bottom: 1.8rem;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .input-group:focus-within label {
            color: #60a5fa;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            outline: none;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            min-height: 48px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #60a5fa;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        #login-btn {
            width: 100%;
            justify-content: center;
            margin-top: 1.5rem;
            min-height: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(to right, #3b82f6 0%, #8b5cf6 50%, #3b82f6 100%);
            background-size: 200% auto;
            border: none;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        #login-btn:hover {
            background-position: right center;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.4);
        }

        #login-btn:active {
            transform: translateY(1px);
        }

        #toggle-password {
            transition: color 0.3s, transform 0.3s !important;
        }

        #toggle-password:hover {
            transform: translateY(-50%) scale(1.15) !important;
            color: #60a5fa !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 0.75rem 0.5rem;
            }

            .login-card {
                padding: 2.2rem 1.4rem;
                margin-top: 4vh;
                border-radius: 20px;
                width: 100%;
            }

            .login-card h2 {
                margin-bottom: 1.8rem;
            }
        }

        @media (max-height: 550px) {
            body {
                align-items: flex-start;
                padding: 0.5rem;
            }
            .login-card {
                margin-top: 0.5rem;
                max-height: 94vh;
                overflow-y: auto;
                padding: 1.8rem 1.4rem;
            }
        }
    </style>
</head>

<body>
    <div class="background-animation"></div>

    <div class="app-container glassmorphism login-card">
        <h2 id="login-title">🔒 RC Fruits Security</h2>

        <div id="login-alert" class="alert hidden"></div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <div style="position: relative;">
                <input type="password" id="password" placeholder="Enter password" style="padding-right: 2.5rem;">
                <span id="toggle-password"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.7; transition: opacity 0.3s;"
                    onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'"
                    title="Toggle Password Visibility">👁️</span>
            </div>
        </div>

        <!-- Left-aligned Sign Up link & Right-aligned Change Password link -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; margin-top: -0.5rem;">
            <a href="signup.html" id="signup-link" style="color: #60a5fa; text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#93c5fd'" onmouseout="this.style.color='#60a5fa'">Sign up</a>
            <a href="forgot_password.html" id="forgot-password-link" style="color: #60a5fa; text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='#93c5fd'" onmouseout="this.style.color='#60a5fa'">Change password?</a>
        </div>

        <!-- Remember Me -->
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.2rem; margin-top: -0.3rem;">
            <input type="checkbox" id="remember-me" style="width: 16px; height: 16px; accent-color: #60a5fa; cursor: pointer;">
            <label for="remember-me" style="color: #94a3b8; font-size: 0.85rem; font-weight: 500; cursor: pointer; user-select: none;">Remember me</label>
        </div>

        <button id="login-btn" class="btn-primary">
            <span class="btn-text">Login</span>
        </button>
    </div>

    <script src="login.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker error', err));
        }
    </script>
</body>

</html>
