<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍉RC Fruits</title>
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="bala.css?v=2">
    <!-- html2pdf Bundle CDN for PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <div class="background-animation"></div>

    <!-- Login Overlay -->
    <div id="login-overlay" class="modal-overlay hidden">
        <div class="app-container glassmorphism login-card">
            <h2 id="modal-security-title">🔒 RC Fruits Security</h2>

            <div id="login-alert" class="alert hidden"></div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" placeholder="Enter password" style="padding-right: 2.5rem;">
                    <span id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.7; transition: opacity 0.3s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'" title="Toggle Password Visibility">👁️</span>
                </div>
            </div>

            <!-- Left-aligned Sign Up link & Right-aligned Forgot Password link -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; margin-top: -0.5rem;">
                <a href="signup.html" id="signup-link" style="color: #60a5fa; text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#93c5fd'" onmouseout="this.style.color='#60a5fa'">Sign up</a>
                <a href="forgot_password.html" id="forgot-password-link" style="color: #60a5fa; text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='#93c5fd'" onmouseout="this.style.color='#60a5fa'">Forgot password?</a>
            </div>

            <!-- Remember Me -->
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.2rem; margin-top: -0.3rem;">
                <input type="checkbox" id="remember-me" style="width: 16px; height: 16px; accent-color: #60a5fa; cursor: pointer;">
                <label for="remember-me" style="color: #94a3b8; font-size: 0.85rem; font-weight: 500; cursor: pointer; user-select: none;">Remember me</label>
            </div>

            <button id="login-btn" class="btn-primary">
                <span class="btn-text">Login</span>
            </button>
        </div>
    </div>

    <div id="main-app" class="app-container glassmorphism hidden">
        <header>
            <div class="header-left">
                <h1 id="main-app-title">🍉 RC Fruits</h1>
            </div>
            <div class="header-right">
                <div class="header-actions" style="display: flex; align-items: flex-end; gap: 0.8rem;">
                    <div class="date-selector">
                        <label for="record-date">Select Date:</label>
                        <input type="date" id="record-date">
                    </div>
                    <button id="view-toggle-btn" class="btn-secondary view-toggle-btn" style="min-height: 44px; padding: 0.6rem 1.1rem; gap: 8px;">
                        <span id="view-toggle-icon">🗂️</span>
                        <span id="view-toggle-text">Card View</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- User Session Bar -->
        <div id="session-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; margin-bottom: 0.5rem; background: rgba(96, 165, 250, 0.08); border: 1px solid rgba(96, 165, 250, 0.15); border-radius: 10px;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-size: 1.1rem;">👤</span>
                <span id="logged-in-user" style="color: #94a3b8; font-size: 0.85rem; font-weight: 500;">Not logged in</span>
            </div>
            <button id="logout-btn" style="display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 1rem; background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.3); border-radius: 8px; color: #f87171; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-family: inherit;"
                onmouseover="this.style.background='rgba(248,113,113,0.25)'; this.style.borderColor='rgba(248,113,113,0.5)'; this.style.transform='translateY(-1px)'"
                onmouseout="this.style.background='rgba(248,113,113,0.15)'; this.style.borderColor='rgba(248,113,113,0.3)'; this.style.transform='translateY(0)'">
                <span>🚪</span>
                <span>Logout</span>
            </button>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <div class="table-wrapper">
            <table class="premium-table">
                <thead>
                    <tr>
                        <th class="sticky-col">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button id="add-shop-btn" class="btn-header-add" title="Add Shop Row">+</button>
                                <span>Shop Name</span>
                            </div>
                        </th>
                        <th>Guava</th>
                        <th>Rate</th>
                        <th>Amount</th>
                        <th>Grapes</th>
                        <th>Rate</th>
                        <th>Amount</th>
                        <th>Sapota</th>
                        <th>Rate</th>
                        <th>Amount</th>
                        <th id="th-total-amount">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button id="add-fruit-btn" class="btn-header-add" title="Add Fruit Column">+</button>
                                <span>Total Amount</span>
                            </div>
                        </th>
                        <th>Given Amount</th>
                        <th>Old Balance</th>
                        <th>Balance</th>
                        <th>Total Empty</th>
                        <th>Empty Return</th>
                        <th>Old Empty</th>
                        <th>Balance Empty</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="sales-table-body">
                    <!-- Data will be loaded dynamically by bala.js -->
                </tbody>
            </table>
        </div>

        <div class="controls">
            <button id="save-all-btn" class="btn-primary">
                <span class="btn-text">Save All Changes</span>
                <span class="btn-icon">✨</span>
            </button>
            <p class="server-status" id="server-status">Checking backend connection...</p>
        </div>
    </div>

    <!-- Bill Modal -->
    <div id="bill-modal" class="modal-overlay hidden">
        <div class="receipt-card">
            <div class="receipt-actions">
                <button onclick="shareWhatsApp()" class="btn-icon-only" title="Share via WhatsApp" style="color: #25d366; display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="width: 20px; height: 20px;">
                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.248 8.477 3.517 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.733-1.455L0 24zm6.59-4.846c1.66.986 3.284 1.488 4.966 1.488 5.485 0 9.948-4.458 9.951-9.94.001-2.656-1.03-5.152-2.903-7.03C16.828 1.794 14.338.761 11.69.761c-5.491 0-9.957 4.463-9.96 9.947-.001 1.77.494 3.486 1.433 5.083L1.93 21.056l5.06-1.328.026.015-1.066.38a9.421 9.421 0 0 0 1.625.378l.056.002-.158-.696zM17.487 14.39c-.29-.146-1.72-.85-1.987-.946-.266-.097-.46-.145-.654.145-.193.291-.749.946-.919 1.14-.17.193-.34.218-.63.073-1.285-.515-2.223-.923-3.003-1.631-.78-.708-1.282-1.547-1.437-1.838-.155-.29-.016-.447.129-.591.13-.13.29-.34.436-.51.145-.17.194-.291.291-.485.097-.194.048-.364-.024-.51-.073-.145-.654-1.579-.897-2.16-.236-.569-.475-.491-.654-.5l-.558-.009c-.194 0-.51.073-.777.364-.266.291-1.02 1.002-1.02 2.443 0 1.442 1.045 2.836 1.19 3.03.146.194 2.057 3.142 4.982 4.407.696.3 1.238.48 1.66.616.7.223 1.338.192 1.843.116.563-.085 1.72-.703 1.962-1.383.243-.68.243-1.263.17-1.383-.074-.12-.27-.193-.56-.34z"/>
                    </svg>
                </button>
                <button onclick="downloadPDF()" class="btn-icon-only" title="Download PDF">📥</button>
                <button onclick="printBill()" class="btn-icon-only" title="Print Bill">🖨️</button>
                <button onclick="closeBill()" class="btn-icon-only" style="color: #f87171;" title="Close">❌</button>
            </div>
            <div id="receipt-content" class="receipt-content">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script src="bala.js?v=42"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker error', err));
        }
    </script>
</body>

</html>
