# Server Port
server.port=8080

# H2 Database configuration (File-based database so data is saved to a file locally)
spring.datasource.url=jdbc:h2:file:./data/baladb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Schema generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console to view database in browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serve frontend directly
spring.web.resources.static-locations=file:D:/project for bala/,classpath:/static/

# ======================================================
# Email Configuration (Gmail SMTP for Password Reset)
# ======================================================
# Configure via .env file: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# MAIL_PASSWORD must be a Gmail App Password (16-char), NOT your normal password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
